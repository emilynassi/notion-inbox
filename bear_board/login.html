<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bear Board</title>
<script>try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<style>
  :root { --bg: #fff; --surface: #f6f6f4; --border: #e2e1dd; --text: #121211; --muted: #8b8a85; --error: #b91c1c; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #000; --surface: #141414; --border: #2a2a2a; --text: #f2f2f0; --muted: #85847f; --error: #f87171; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #000; --surface: #141414; --border: #2a2a2a; --text: #f2f2f0; --muted: #85847f; --error: #f87171; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--text); font: 15px/1.5 ui-monospace, "SF Mono", Menlo, monospace; }
  form { width: min(360px, 100%); display: flex; flex-direction: column; gap: 14px; }
  h1 { margin: 0 0 6px; font: 700 32px/1 "Times New Roman", Georgia, serif; letter-spacing: -1.2px; }
  input { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 0 16px; height: 50px; outline: none; }
  input:focus { border-color: var(--muted); }
  button { font: inherit; font-weight: 700; height: 50px; border-radius: 12px; border: 0; cursor: pointer;
    background: var(--text); color: var(--bg); }
  .error { color: var(--error); font-size: 14px; margin: 0; }
  .error:empty { display: none; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Bear Board</h1>
  <input type="password" name="password" placeholder="Password" autocomplete="current-password" required autofocus aria-label="Password">
  <p class="error" role="alert">{{error}}</p>
  <button type="submit">Sign in</button>
</form>
</body>
</html>
